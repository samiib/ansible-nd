          were silently reported as success/changed, masking failures and breaking
          idempotency. is_success() now returns False when any per-item status is
          failed/failure/ error (case-insensitive, whitespace-tolerant, scanned regardless
          of the success code); extract_error_message() aggregates the failing items
          as "label: message". The dict-error handling is factored into a helper to

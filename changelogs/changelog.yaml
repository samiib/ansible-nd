          \ injection. Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com> * Fix\
          \ black formatting in fabric_context.py and test_loopback_interface.py Co-Authored-By:\
          \ Claude Opus 4.6 <noreply@anthropic.com> * Fix ansible-test sanity failures\
          \ for shebang and validate-modules - Remove shebang from tests/integration/inventory.py\

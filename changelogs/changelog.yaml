          (#344) Three orchestrators (manage_fabric_ebgp_vxlan, manage_fabric_ibgp_vxlan,
          manage_fabric_external) declared model_class without ClassVar, turning it
          into a pydantic field. Consequences: - pydantic strips the field default
          from the class namespace, so   class-level access (cls.model_class) silently
          resolved to the parent s   NDBaseModel instead of the declared feature model
          - every pydantic version warned that the field shadows the parent attribute
          - pydantic <2.10 refused to build the classes outright (NameError: protected   namespace
          "model_"), the error reported in #344 Note the version direction in #344
          is inverted: lab-verified against pydantic 2.9.2 / 2.11.10 / 2.12.0 / 2.12.2
          / 2.12.5, the hard error occurs on <2.10 only; 2.11 and all of 2.12.x import
          fine. The pydantic>=2.11,<2.12 cap is therefore unnecessary and the desired
          ==2.12.5 pin works. Also set protected_namespaces=() on NDBaseOrchestrator.model_config:
          pydantic <2.10 applies the protected-namespace check even to ClassVar annotations,
          and module_utils execute on user-controlled hosts where older pydantic 2.x
          may be installed. Unit tests sweep every orchestrator subclass to keep model_class
          out of model_fields and pin the class-level resolution for the three fixed
          orchestrators. Co-Authored-By: Claude Fable 5 <noreply@anthropic.com> Claude-Session:

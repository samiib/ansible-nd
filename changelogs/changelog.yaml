          set together per class (#351) Add StormControlMutexMixin, a shared model_validator(mode="after")
          that rejects setting both the percentage level (storm_control_<class>_level)
          and the pps level (storm_control_<class>_level_pps) for the same storm-control
          traffic class. ND accepts both, echoes both on GET (so there is no perpetual
          diff), but silently applies the percentage and drops the pps at config generation
          -- lab-verified on ND 4.3.1.75 and 4.2.1.10. The mixin is shared by all
          five interface policy models (ethernet_access, port_channel_access, port_channel_trunk_host,
          vpc_access, vpc_trunk_host). Document the per-class mutual exclusivity in
          the four modules that were missing the note (ethernet_access already had
          it). Add parametrized unit tests across all five models. No TODO(X.Y.Z)

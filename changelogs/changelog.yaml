          \ proposed-side   canonicalization is needed. _switch_ids_to_ips is retained\
          \ only for wire->output   denormalization in GET responses. Tests: add 00240/00250\
          \ (replaced-resets vs merged-retains), 00715 (non-IP rejected); create/update/bulk\
          \ tests use IP-form input with an in-memory FabricContext stand-in. Full\
          \ unit suite green (625). Framework limitation tracked in #305: the shared\
          \ subset diff cannot detect a reset-only replaced change (omitted field\
          \ at a non-default value), so a reset-only run still reports no_diff. Co-Authored-By:\
          \ Claude Opus 4.8 (1M context) <noreply@anthropic.com> * Address nd_fabric_update_group\

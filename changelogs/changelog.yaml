          \ \"create-path PUT detaches just-attached switches\" finding   verified\
          \ NOT a bug: the create-path settings PUT derives updateGroupSwitches  \
          \ from the user s model (re-applied by merge), not from the post-attach\
          \ GET,   so an eventually-consistent empty GET cannot produce a detaching\
          \ PUT. Added   regression test 00160 (GET returns empty membership; PUT\
          \ still carries the   user s switches) to lock in the guarantee. 646 unit\
          \ tests pass; black/isort/pylint/mypy clean (module s 4 mypy errors are\
          \ pre-existing on unchanged lines). Co-Authored-By: Claude Opus 4.8 (1M\
          \ context) <noreply@anthropic.com> * Relax UpdateReportCheckModel.report_check_name\
          \ for read-tolerance Lab-verified (ND 4.2.1, 192.168.7.7): the embedded\
          \ updateGroup.updateReportChecks item schema does NOT mark reportCheckName\

          * Gate storm-control mutex to config input, not ND responses (PR #360 review)
          The mixin s model_validator(mode="after") fired on every construction, including
          from_response(). Since ND accepts and echoes both the percentage and pps
          for a class on GET (issue #351, the very behavior this PR documents), an
          existing device in that state made query/gathered/diff raise a ValidationError
          before the module could report or remediate it. Thread provenance into the
          validation context: from_config() sets mode="config" and from_response()
          sets mode="response" (reusing the existing context={"mode": ...} idiom already
          on to_payload/to_config). The mixin now skips enforcement when mode=="response"
          and enforces on every other path (from_config, direct construction, any
          non-response context), so the write path still fails fast while the read
          path stays permissive. Context propagates to nested validation, so a top-level
          from_response() reaches the nested policy model where the mixin lives. Add
          paired coverage across all five models x three classes: from_config() rejects
          the conflict; from_response() accepts the ND echo and preserves both values.
          gmicol review catch. Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_011ybD6en6LMR4xaphx5D2Kx
          * Storm-control mutex: add trunkHost; treat pct/pps as one setting in merge
          (PR #360 review) Two mikewiebe review findings: 1. Physical ethernet trunkHost
          responses were unparseable.    EthernetTrunkHostPolicyModel never got the
          response-aware mixin; it kept    its older unconditional validator, so from_response()
          on the dual-valued    echo that motivated issue #351 raised during before-collection
          init and    blocked every state, including a delete task with no storm-control
          fields.    Reparent it onto StormControlMutexMixin, drop the duplicate validator,
          and    add it as the sixth model in the test matrix plus a top-level    from_response()
          regression using the ND-shaped payload from the review. 2. state:merged
          could not switch pct<->pps or remediate dual-valued ND state.    Percentage
          and pps are two representations of one NX-OS threshold, but the    generic
          merge treated them as independent fields: switching units raised    through
          assignment validation (both transiently set, no response context),    and
          dual-valued state plus matching single-variant intent was classified    no_diff
          by the one-way subset comparison, so the stale percentage was    never cleared.    The
          mixin now overrides merge() to clear an existing counterpart when    proposed
          config explicitly selects the other variant, with mutex    enforcement suspended
          (ContextVar) for the in-place merge so a    legitimately dual-valued echo
          survives unrelated merges untouched; the    clearing rule guarantees the
          merge itself can never introduce a new    conflict. A new generic NDBaseModel.merge_would_change()
          hook recurses    into nested models and is consulted by get_diff(exclude_unset=True),
          so    the mixin can report the pending clear as a diff from the nested policy    level
          that the top-level dict-subset comparison cannot see.    Lifecycle coverage
          parametrized across all six interface families:    pct->pps, pps->pct, dual+matching
          pps, dual+changed pps, unrelated merge    preserving the dual echo, per-class
          clearing scope, and an idempotency    no-false-positive guard. Co-Authored-By:
          Claude Fable 5 <noreply@anthropic.com> * Report field removals as changed
          in before/after comparison (PR #360 review) NDOutput.format derives the
          module-level changed flag from NDConfigCollection.get_diff_collection, whose
          per-item comparison was a one-way subset test. An operation that only REMOVES
          a field from an item -- exactly what the storm-control pct/pps merge does
          when it clears the stale percentage from a dual-valued ND echo -- produced
          an after-item that is a strict subset of its before-item, so the collections
          compared as equal and the module reported changed: false even though the
          update executed on ND. Lab-verified on SITE1: the dual-state remediation
          PUT ran and cleared the percentage from ND intent, while the module output
          said nothing changed. Run the per-item comparison in both directions so
          removals count. The reverse pass also subsumes the old missing-key check
          (an item absent from `other` classifies as "new"). Co-Authored-By: Claude
          Fable 5 <noreply@anthropic.com> * Integration: storm-control merge lifecycle
          + dual-state remediation (PR #360 review) Add lab coverage for treating
          the storm-control percentage/pps pair as one logical setting under state:merged
          (nd_interface_ethernet_trunk_host, which also exercises the trunkHost model
          reparented onto StormControlMutexMixin): - pct->pps and pps->pct unit switches:
          assert changed, counterpart absent   from the after-state, then re-apply
          and assert idempotency. The   idempotency pass is the wire proof that ND
          actually clears the omitted   counterpart on PUT (if it still echoed both,
          the response-aware diff   would classify the re-apply as a change and fail
          the assert). - Dual-state remediation: seed the exact issue #351 controller
          state (both   variants set) via raw nd_rest PUT -- the module refuses to
          create it --   assert ND accepts and echoes both, then apply matching pps
          intent and   assert it is classified as a change, the percentage is cleared,
          and the   remediated state is idempotent. The switch serial is resolved
          at runtime   from test_switch_ip (9000v serials change on reload; never
          hardcode), and   the PUT body carries switchId to match the path segment
          (ND 400s   "Invalid switch ID" otherwise). Also fix pre-existing target
          rot in setup.yaml: the check-mode merge probe passed a bare `policy:`, which
          the policy-required-on-create preflight (issue #350, added after the probe
          was written) rejects when the cleanup actually removed the interface. The
          probe now sends `policy: {}` -- present but empty -- preserving its intent.
          Full target run against ND SITE1: ok=117 changed=40 failed=0. Co-Authored-By:
          Claude Fable 5 <noreply@anthropic.com> --------- Co-authored-by: Claude
          Opus 4.8 (1M context) <noreply@anthropic.com>'

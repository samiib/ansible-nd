          \   is state-aware: for replaced/overridden it seeds only the PUT-required\
          \ fields from   the current group and overlays the user s explicitly-set\
          \ fields, so optional fields   the user omits are absent from the body and\
          \ ND (full replace) resets them. merged   still overlays onto the full current\
          \ group (omitted fields preserved). Previously   replaced merged onto current\
          \ and silently behaved like merged while misreporting   changed. PUT full-replace\
          \ semantics verified live on ND 4.2.1 (SITE1). - Switches are now IP-only\
          \ input. _resolve_switch_id rejects a non-IP value with a   clear error\

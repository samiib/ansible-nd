          \ have no minimum-switch guard and cannot represent a zero-switch group,\
          \ so reusing a switch between groups silently left an unreadable \"ghost\"\
          \ group behind. Rebuild the write path on the ghost-safe softwareUpdatePlan/actions\
          \ API: attachGroup creates groups and assigns switches, detachGroup removes\
          \ switches (ND auto-deletes an emptied group), and group settings are applied\
          \ via PUT built from a GET of the current group so it never moves membership.\
          \ Add a force_created option so a group whose membership trips an ND pre-flight\
          \ warning can be applied. Reads stay on the group-centric GET endpoints;\
          \ the now-unused group-centric POST endpoint is removed. Verified live on\
          \ ND 4.2.1: detachGroup last-switch auto-delete, PUT membership no-op, and\
          \ attachGroup forceCreated semantics (a warning status means ND applied\
          \ nothing, so it always fails the task). Co-Authored-By: Claude Opus 4.7\
          \ (1M context) <noreply@anthropic.com> * Modernize fabric_update_group model\
          \ type annotations Convert the FabricUpdateGroupModel annotations from typing.Optional\
          \ / List / Dict to the PEP 604 / PEP 585 forms (X | None, list[X], dict)\
          \ per the collection s type-annotation standard, and trim the now-unused\
          \ typing imports. Annotation-only change; verified clean against ansible-test\
          \ sanity (compile / import / pep8) on Python 3.8-3.13. Co-Authored-By: Claude\
          \ Opus 4.7 (1M context) <noreply@anthropic.com> * Add auto_assign option\

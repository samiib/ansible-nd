          \ * Fix Pydantic error on underscore-prefixed Field defaults Pydantic disallows\
          \ Field() on names with leading underscores. Move _pending_deploys and _pending_removes\
          \ initialization into model_post_init() so each instance gets its own fresh\
          \ list without triggering the Pydantic naming restriction. Co-Authored-By:\
          \ Claude Opus 4.6 <noreply@anthropic.com> * Add broad exception handler\
          \ to nd_interface_loopback module The module only caught NDStateMachineError,\
          \ leaving AssertionError and other runtime exceptions to produce unhandled\
          \ tracebacks. Add a fallback except Exception handler so all failures are\
          \ consistently reported via module.fail_json. Co-Authored-By: Claude Opus\
          \ 4.6 <noreply@anthropic.com> * Migrate FabricContext and interface orchestrators\
          \ to RestSend Follow-up to PR #250 (NDA-26), which replaced NDModule with\
          \ RestSend in the orchestrator framework. The interface-module infrastructure\
          \ still referenced self.sender and broke at runtime (AttributeError on FabricContext\
          \ / base_interface / loopback_interface). - fabric_context.py: accept rest_send\

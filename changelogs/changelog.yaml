          include-allowlist, so modules can compose the subset of config actions they
          support instead of hand-writing the block.
        - Relocate ``nd_argument_spec()`` to ``plugins/module_utils/nd_argument_specs.py``
          as the single source of truth; ``nd.py`` and ``nd_v2.py`` continue to re-export
          it, so existing imports keep working unchanged.
      release_summary: 'Release v1.5.1 of the ``ansible-nd`` collection on 2026-08-25.

        This changelog describes all changes made to the modules and plugins included
        in this collection since v1.5.0.


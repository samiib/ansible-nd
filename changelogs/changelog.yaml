          propose\" action as a new top-level auto_assign option (roleBased / evenOdd),\
          \ letting ND auto-generate update groups instead of defining them explicitly\
          \ in config. The auto-assign path bypasses NDStateMachine (its per-group\
          \ config-diff state model does not fit a single fabric-level action) and\
          \ derives changed from a before/after query_all snapshot. auto_assign is\
          \ mutually exclusive with config and valid only with state merged or overridden;\
          \ check mode reports no change since the propose action cannot be previewed.\
          \ Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com> *\

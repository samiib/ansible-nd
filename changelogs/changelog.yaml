        - "(#284) * Add nd_maintenance_mode module for switch system mode changes\
          \ Wraps POST /api/v1/manage/fabrics/{fabric_name}/switchActions/changeSystemMode\
          \ to set switches in a fabric to `normal` or `maintenance` mode. The endpoint\
          \ is action-shaped (one POST mutates a batch of switches with a single mode),\
          \ and the module adapts it to NDStateMachine s CRUD-shaped driver via an\
          \ identifier_strategy=\"singleton\" model and a config-dict-to-list wrap\
          \ in main(). Idempotency reads `additionalData.intendedSystemMode` per switch\
          \ and only POSTs switches whose intent differs from the request. Any switch\
          \ currently in `migration` mode triggers a hard-fail with the remediation\
          \ instruction to run Recalculate and Deploy  in the ND UI before retrying.\
          \ The 207 response body is inspected per-item; any failed entry surfaces\
          \ as a RuntimeError naming the offending switches by IP. State support:\
          \ `merged` only. `gathered` will be added when the underlying NDStateMachine/NDOutput\

          \ ND 4.2 update groups Add the nd_fabric_update_group module to manage Fabric\
          \ Software Management update groups (the ND 4.2 successor to NDFC/ND 3.x\
          \ image policies). Built on the Gen 3 architecture: FabricUpdateGroupModel,\
          \ FabricUpdateGroupOrchestrator, smart endpoints, and NDStateMachine. Supports\
          \ merged, replaced, overridden, and deleted states. - update_group_switches\
          \ / installation_order_devices accept switch IPs or   serial numbers; IPs\
          \ are resolved to switchIds via FabricContext. - Two ND 4.2.1 wire workarounds:\
          \ installationOrderDevices is silently dropped   on write (excluded from\
          \ the idempotency diff, TODO(4.2.1)); the ND-managed   default group named\
          \ \"None\" is filtered from query results. - Adds UpdateGroupNameMixin to\
          \ endpoints/mixins.py. - 58 unit tests (model + orchestrator) and an integration\
          \ test target. Note: this work is postponed pending an ND-side fix for a\
          \ zero-switch \"ghost group\" defect that breaks idempotent reconciliation\
          \ of overridden state. A bug has been filed with the ND developers. Co-Authored-By:\
          \ Claude Opus 4.7 (1M context) <noreply@anthropic.com> * Redesign nd_fabric_update_group\

        - "(#220) * Add InterfaceNameMixin * nd_loopback_interface initial commit\
          \ * Remove deploy_type param. Use bulk delete endpoint 1. Team decided not\
          \ to allow switch level deploy in resource modules. - Removed deploy_type\
          \ parameter and use only interface-level deploy endpoint. - Updated module\
          \ documentation 2. Leverage bulk endpoint for interface deletion. POST \u2026\
          interfaceActions/remove 3. Remove single-interface DELETE endpoint DELETE\
          \ \u2026interfaces/{interface_name} 4. Add initial unit tests for nd_interface_loopback\
          \ * Fix state:overridden attempting to delete system-provisioned loopback\
          \ interfaces query_all() in LoopbackInterfaceOrchestrator previously filtered\
          \ interfaces only by interfaceType == \"loopback\", which included system-provisioned\
          \ loopbacks (Loopback0 routing, Loopback1 VTEP) that ND creates during initial\
          \ switch role configuration. These have policyType \"underlayLoopback\"\
          \ and are not deletable. When state:overridden was used, the module saw\
          \ these system loopbacks in the before collection, identified them as \"\
          not in proposed\", and queued them for removal. ND silently rejected the\
          \ delete requests (the interfaces have deletable: false), but the module\
          \ incorrectly reported changed=true and made unnecessary API calls. The\
          \ fix adds a second filter stage to query_all() that checks each loopback\
          \ s configData.networkOS.policy.policyType against the set of policy types\
          \ this module manages (loopback, ipfmLoopback, userDefined). System loopbacks\
          \ with policyType \"underlayLoopback\" are now excluded from the before\
          \ collection. This ensures: - Accurate changed flag (no false positives\
          \ from undeletable interfaces) - No unnecessary remove API calls for system-managed\
          \ interfaces - The module correctly understands its own management scope\
          \ Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com> * Add integration\
          \ tests for nd_interface_loopback module Integration test suite covering\
          \ all four states (merged, replaced, overridden, deleted) for the nd_interface_loopback\
          \ module. Tests are organized into separate task files per state for easier\
          \ debugging and selective execution. Test coverage includes: - Merged: create\
          \ single/multiple, idempotency, update, deploy=false - Replaced: full replace,\
          \ idempotency, multi-interface replace - Overridden: reduce to single, idempotency,\
          \ system loopback filtering,   swap interfaces in one pass - Deleted: single/multi\
          \ delete, idempotency, non-existent interface The overridden tests include\
          \ a dedicated system loopback filtering test that verifies Loopback0/Loopback1\
          \ (policyType \"underlayLoopback\") do not appear in the before collection\
          \ and are not targeted for deletion. Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>\
          \ * Add dynamic inventory generator for integration tests Python script\
          \ that serves dual purpose: - Generator mode (no args): reads ND connection\
          \ and testbed topology   from environment variables and writes a static\
          \ inventory.networking   file for use with ansible-test network-integration\
          \ - Dynamic inventory mode (--list): outputs JSON inventory to stdout  \
          \ for direct use with ansible-playbook -i inventory.py Required env vars:\
          \ ND_IP4, ND_USERNAME, ND_PASSWORD, ND_DOMAIN Optional env vars: ND_FABRIC_NAME,\
          \ ND_SWITCH_IP (with defaults) The generator approach is needed because\
          \ ansible-test sanitizes the subprocess environment, stripping arbitrary\
          \ env vars at runtime. Running the generator beforehand bakes values into\
          \ a static INI file that ansible-test picks up automatically. Co-Authored-By:\

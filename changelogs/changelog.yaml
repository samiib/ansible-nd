          \ with six tests   covering fabric summary 200/404, switch_map parsing,\
          \ get_switch_id   failure, and validate_for_mutation success/failure. Co-Authored-By:\
          \ Claude Opus 4.7 <noreply@anthropic.com> * Tighten FabricContext pre-flight\
